version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "fix(deps)"
    # Stay on the net10.0 LTS: no major bumps (Microsoft.Extensions.* 11.x targets .NET 11).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
          - "Azure.*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci(deps)"
